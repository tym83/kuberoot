# The intents translator acts with exactly what lowering needs.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kuberoot:intents
rules:
- apiGroups: [intents.kuberoot.dev]
  resources: [apps, overrides]
  verbs: [get, list, watch]
- apiGroups: [intents.kuberoot.dev]
  resources: [apps/status, overrides/status]
  verbs: [get, patch, update]
- apiGroups: [apps]
  resources: [deployments]
  verbs: [get, list, watch, create, patch, update]
- apiGroups: [""]
  resources: [services, configmaps]
  verbs: [get, list, watch, create, patch, update]
- apiGroups: [""]
  resources: [namespaces]
  verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kuberoot:intents
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kuberoot:intents
subjects:
- apiGroup: rbac.authorization.k8s.io
  kind: User
  name: kuberoot:intents
