# Typed intents: what a user may ask for, checked by the API server itself.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: apps.intents.kuberoot.dev
spec:
  group: intents.kuberoot.dev
  scope: Namespaced
  names: {kind: App, listKind: AppList, plural: apps, singular: app}
  versions:
  - name: v1alpha1
    served: true
    storage: true
    subresources: {status: {}}
    additionalPrinterColumns:
    - {name: Image, type: string, jsonPath: .spec.image}
    - {name: Replicas, type: integer, jsonPath: .spec.replicas}
    - {name: Ready, type: integer, jsonPath: .status.readyReplicas}
    - {name: State, type: string, jsonPath: .status.state}
    - {name: Age, type: date, jsonPath: .metadata.creationTimestamp}
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            required: [image]
            x-kubernetes-validations:
            - rule: "!(has(self.expose) && self.expose) || has(self.port)"
              message: an exposed app needs a port
            properties:
              image:
                type: string
                description: Container image, pinned to a tag or a digest.
                maxLength: 512
                x-kubernetes-validations:
                - rule: self.contains('@sha256:') || (self.contains(':') && !self.endsWith(':latest'))
                  message: pin the image to a tag or a digest, never latest
              replicas:
                type: integer
                minimum: 0
                maximum: 20
                default: 1
              port:
                type: integer
                minimum: 1
                maximum: 65535
              expose:
                type: boolean
                description: Give the app a Service on its port.
              env:
                type: object
                additionalProperties: {type: string}
                maxProperties: 64
              memory:
                type: string
                description: Memory limit, e.g. 256Mi.
                default: 256Mi
                x-kubernetes-validations:
                - rule: quantity(self).isLessThan(quantity('8Gi'))
                  message: an app gets less than 8Gi; ask for more through an Override
          status:
            type: object
            properties:
              observedGeneration: {type: integer}
              readyReplicas: {type: integer}
              state: {type: string}
              message: {type: string}
---
# The audited emergency exit: who, why, for how long.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: overrides.intents.kuberoot.dev
spec:
  group: intents.kuberoot.dev
  scope: Namespaced
  names: {kind: Override, listKind: OverrideList, plural: overrides, singular: override}
  versions:
  - name: v1alpha1
    served: true
    storage: true
    subresources: {status: {}}
    additionalPrinterColumns:
    - {name: User, type: string, jsonPath: .spec.user}
    - {name: App, type: string, jsonPath: .spec.app}
    - {name: State, type: string, jsonPath: .status.state}
    - {name: Expires, type: string, jsonPath: .status.expiresAt}
    - {name: Reason, type: string, jsonPath: .spec.reason, priority: 1}
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            required: [user, app, reason, ttl]
            x-kubernetes-validations:
            - rule: self == oldSelf
              message: an override cannot be changed; create a new one
            properties:
              user:
                type: string
                description: Who may act on the app's primitives directly.
                minLength: 1
                maxLength: 253
                x-kubernetes-validations:
                - rule: '!self.matches("\\s")'
                  message: a user name has no whitespace
              app:
                type: string
                description: The App whose translation is paused meanwhile.
              reason:
                type: string
                minLength: 10
                description: Why, for the audit trail.
              ttl:
                type: string
                description: How long, at most one hour.
                x-kubernetes-validations:
                - rule: duration(self) > duration('0s') && duration(self) <= duration('1h')
                  message: ttl must be between 0 and 1h
          status:
            type: object
            properties:
              state: {type: string}
              expiresAt: {type: string}
