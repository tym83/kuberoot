# kubectl inside the tenant network: VMs sit on pod IPs, so the node API is
# reachable directly from here.
apiVersion: v1
kind: Pod
metadata:
  name: toolbox
  namespace: tenant-kuberoot
spec:
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    seccompProfile:
      type: RuntimeDefault
  containers:
  - name: kubectl
    image: registry.k8s.io/kubectl:v1.34.1
    command: ["sleep", "infinity"]
    env:
    - name: HOME
      value: /tmp
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop: [ALL]
    resources:
      requests: {cpu: 20m, memory: 64Mi}
      limits: {cpu: 200m, memory: 256Mi}
