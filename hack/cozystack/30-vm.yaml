# Like hardware: boot media first, an empty system disk second. After the
# install, drop the media disk from the list, as you would pull the USB stick.
apiVersion: apps.cozystack.io/v1alpha1
kind: VMInstance
metadata:
  name: node1
  namespace: tenant-kuberoot
spec:
  instanceType: ""
  instanceProfile: linux.efi
  runStrategy: Always
  resources:
    cpu: 4
    sockets: 1
    memory: 6Gi
  external: true
  externalMethod: PortList
  externalAllowICMP: true
  externalPorts:
  - 50000
  - 6443
  disks:
  - name: media
  - name: system
