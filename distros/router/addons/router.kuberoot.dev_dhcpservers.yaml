---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: dhcpservers.router.kuberoot.dev
spec:
  group: router.kuberoot.dev
  names:
    kind: DHCPServer
    listKind: DHCPServerList
    plural: dhcpservers
    shortNames:
    - dhcp
    singular: dhcpserver
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.link
      name: Link
      type: string
    - jsonPath: .spec.rangeStart
      name: Range
      type: string
    - jsonPath: .status.activeLeases
      name: Leases
      type: integer
    - jsonPath: .status.conditions[?(@.type=="Applied")].status
      name: Applied
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          DHCPServer hands out addresses on a link and answers DNS there, from a
          cache in front of the router's own resolvers.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            properties:
              dnsServers:
                description: DNSServers handed to clients; the router itself when
                  unset.
                items:
                  type: string
                type: array
              domain:
                description: Domain clients are told they are in, and their names
                  resolve in.
                type: string
              gateway:
                description: Gateway handed to clients; the router's address on the
                  link when unset.
                type: string
              leaseTime:
                default: 12h
                description: LeaseTime, such as 12h.
                type: string
              link:
                type: string
              rangeEnd:
                type: string
              rangeStart:
                type: string
              staticLeases:
                items:
                  properties:
                    address:
                      type: string
                    hostname:
                      type: string
                    mac:
                      pattern: ^([0-9a-fA-F]{2}:){5}[0-9a-fA-F]{2}$
                      type: string
                  required:
                  - address
                  - mac
                  type: object
                type: array
            required:
            - link
            - rangeEnd
            - rangeStart
            type: object
          status:
            properties:
              activeLeases:
                format: int32
                type: integer
              conditions:
                description: 'Conditions: Applied says whether the node runs this
                  configuration.'
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              leases:
                items:
                  properties:
                    address:
                      type: string
                    expires:
                      format: date-time
                      type: string
                    hostname:
                      type: string
                    mac:
                      type: string
                  required:
                  - address
                  - mac
                  type: object
                type: array
              observedGeneration:
                description: ObservedGeneration is the generation the conditions describe.
                format: int64
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
