---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: agents.ai.kuberoot.dev
spec:
  group: ai.kuberoot.dev
  names:
    kind: Agent
    listKind: AgentList
    plural: agents
    singular: agent
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.model
      name: Model
      type: string
    - jsonPath: .status.findings
      name: Findings
      type: integer
    - jsonPath: .status.lastCheck
      name: Checked
      type: date
    - jsonPath: .status.message
      name: Message
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          Agent is the operator agent of the cluster: the model it thinks with and
          the policy its remedies run under. There is one, named default; without
          it the agent watches nothing.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            properties:
              apiKeySecret:
                description: |-
                  APIKeySecret names a Secret in kube-system, named kuberoot-agent,
                  whose key api-key holds the endpoint's key; none is sent when false.
                type: boolean
              autoApprove:
                description: 'AutoApprove: actions that run without a person approving
                  them.'
                items:
                  enum:
                  - RestartService
                  - RestartModelServer
                  - RollbackModel
                  - RebootNode
                  type: string
                type: array
              endpoint:
                description: Endpoint of an OpenAI-compatible API; the cluster's own
                  when unset.
                type: string
              maxPerHour:
                default: 4
                description: MaxPerHour bounds the actions run in any hour, approved
                  or not.
                format: int32
                minimum: 0
                type: integer
              model:
                description: Model the agent asks, by name, at Endpoint.
                type: string
              paused:
                description: 'Paused: the agent watches and proposes nothing.'
                type: boolean
            required:
            - model
            type: object
          status:
            properties:
              findings:
                description: 'Findings: problems seen on the last check.'
                format: int32
                type: integer
              lastCheck:
                format: date-time
                type: string
              message:
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
